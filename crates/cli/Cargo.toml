[package]
name = "lgtm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lgtm"
path = "src/main.rs"

[dependencies]
lgtm-protocol.workspace = true
lgtm-orchestrator.workspace = true
lgtm-agent.workspace = true
lgtm-client.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
clap.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Pinned to what reqwest already pulls in, so installing the crypto provider
# in `main` adds no new crates to the build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# New dep: `lgtm upgrade` verifies a downloaded release against SHA256SUMS.
sha2 = "0.11"
