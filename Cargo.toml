[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]
# The Tauri review app keeps its own lockfile until it is retired.
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
lgtm-protocol = { path = "crates/protocol" }
lgtm-orchestrator = { path = "crates/orchestrator" }
lgtm-client = { path = "crates/client" }
lgtm-github = { path = "crates/github" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
