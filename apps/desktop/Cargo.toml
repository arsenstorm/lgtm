[package]
name = "lgtm-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lgtm-desktop"
path = "src/main.rs"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
lgtm-protocol.workspace = true
lgtm-client.workspace = true
lgtm-diff.workspace = true
lgtm-orchestrator.workspace = true
lgtm-agent.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
dirs.workspace = true
gpui = "0.2.2"
gpui-component = "0.5.1"
toml = "1"
# The context menu is AppKit's own; gpui draws menus of its own instead of
# opening one. Both crates are already in the tree under gpui.
cocoa = "0.26"
objc = "0.2"
